aid: lanzatech
name: LanzaTech
description: LanzaTech is a carbon recycling company (Nasdaq LNZA) that uses gas fermentation to convert
  waste carbon into fuels and chemicals. Its technology retrofits an industrial site such as a steel mill,
  a ferroalloy plant or a landfill with a bioreactor in which proprietary bacteria consume carbon-rich
  off-gases and produce ethanol and other intermediates, marketed as CarbonSmart products and used by
  brands including Unilever, Coty and Zara. The company operates commercial plants in China, India and
  Belgium, is building the LanzaTech Porsgrunn CCUS project in Norway with Eramet, and works with LanzaJet
  on sustainable aviation fuel. LanzaTech publishes no developer program, but lanzatech.com runs on
  WordPress and exposes a fully public, unauthenticated WordPress REST API whose custom content types
  (news, employee, board-member, download, testimonial) model the company itself.
