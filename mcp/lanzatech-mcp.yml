excluded:
  reason: Not useful or not available to an unauthenticated agent.
  routes:
  - /wp/v2/users - blocked at the Sucuri WAF, returns HTML 403
  - /wp/v2/settings - returns 401 rest_forbidden
  - /wp/v2/comments - registered but empty (X-WP-Total 0)
  - autosave and revision routes on every post type
  - block, template, template-part, global-styles, widget, sidebar, menu and theme administration routes
  - the elementor, elementor-pro, google-site-kit, jet-engine, wp-site-health and wp-block-editor
    namespaces, which are plugin-internal
