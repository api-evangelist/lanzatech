  /wp/v2/global-styles/themes/{stylesheet}/\s%\w\.\(\)\[\]\@_\-]+)/variations:
    parameters:
    - name: stylesheet
      in: path
      required: true
      description: 'Route-matched value (WordPress route pattern: (?P<stylesheet>[\).'
      schema:
        type: string
    get:
      operationId: getGlobalStylesThemes\s%\w\.\(\)\[\]\@\]+)VariationsByStylesheet
