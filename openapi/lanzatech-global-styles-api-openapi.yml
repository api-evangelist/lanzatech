    get:
      operationId: getGlobalStylesThemes:<>\*\?"\|]+(?:\[^\:<>\*\?"\|]+)?)ByStylesheet
      summary: GET /wp/v2/global-styles/themes/{stylesheet}/:<>\*\?"\|]+(?:\/[^\/:<>\*\?"\|]+)?)
