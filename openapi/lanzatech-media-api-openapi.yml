      tags:
      - media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Unique identifier for the attachment.
                action:
                  type: string
                  enum:
                  - create-image-subsizes
                  description: ''
              required:
              - action
      security:
      - applicationPassword: []
      responses:
        '200':
          description: Successful response.
