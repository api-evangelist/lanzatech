components:
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: WordPress application passwords, advertised by the API root document at https://lanzatech.com/wp-json/
        (authentication.application-passwords.endpoints.authorization = https://lanzatech.com/wp-admin/authorize-application.php).
