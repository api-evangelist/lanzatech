openapi: 3.0.3
info:
  title: LanzaTech WordPress REST API
  version: wp/v2
  description: 'The public WordPress REST API served by lanzatech.com. Derived faithfully from the provider''s
    own live discovery document at https://lanzatech.com/wp-json/ on 2026-07-19. Alongside the standard
    WordPress content types (posts, pages, media, categories, tags), LanzaTech publishes five custom content
    types that model the company itself: news (external news coverage), employee, board-member, download
    (published reports and life-cycle assessments) and testimonial. Read operations are publicly accessible
    without authentication; write operations require a WordPress application password.'
  contact:
    name: LanzaTech
    url: https://lanzatech.com/contact/
  termsOfService: https://lanzatech.com/terms-of-use/
  x-generated: '2026-07-19'
  x-method: derived
  x-source: https://lanzatech.com/wp-json/
servers:
- url: https://lanzatech.com/wp-json
  description: Production
