  channel: web-form

change_communication:
  changelog_url: null
  note: LanzaTech publishes no API changelog. Company-level change is announced on the Re:Carbon blog
    (https://lanzatech.com/blog/, RSS at https://lanzatech.com/feed/) and in investor relations material
    at https://ir.lanzatech.com/. Neither is an API changelog, so no ChangeLog pointer is emitted.

operational_observations:
  waf: Sucuri
  note: A Sucuri WAF fronts the site. It intercepts /wp/v2/users and unauthenticated writes ahead of
    WordPress and returns HTML rather than the JSON error envelope. This is the closest thing to a
    published access policy the provider has, and it is not documented anywhere.
  tls_version: TLSv1.3
  cert_expires: 'Aug 29 21:49:07 2026 GMT'
  hsts: false
